name: Auto Deploy to CF

on:
  schedule:
    - cron: '0 18 * * *' # 每天北京时间凌晨2点自动更新
  workflow_dispatch:     # 允许手动点击按钮立即更新

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出当前仓库
        uses: actions/checkout@v4

      - name: 2. 拉取 cmliu 最新版 _worker.js
        run: |
          curl -sL https://raw.githubusercontent.com/cmliu/edgetunnel/main/_worker.js -o _worker.js
          mkdir -p dist
          cp _worker.js dist/_worker.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git diff --staged --quiet || (git commit -m "Auto update _worker.js" && git push)

      - name: 3. 直接上传到 Cloudflare 的 wl 项目
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist --project-name=wl --branch=main
